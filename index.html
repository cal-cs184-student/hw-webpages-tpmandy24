<!DOCTYPE html>
<html lang="en">
<head>
	<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
	<meta http-equiv="content-type" content="text/html; charset=utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>CS184/284A Homework Webpages</title>

	<style>
		* {
			box-sizing: border-box;
		}

		body {
			font-family: 'Inter', sans-serif;
			line-height: 1.5;
			color: #f8e7e7;
			background:
				radial-gradient(circle at top left, rgba(255, 0, 68, 0.25), transparent 35%),
				radial-gradient(circle at bottom right, rgba(180, 0, 0, 0.35), transparent 40%),
				linear-gradient(135deg, #080506 0%, #160406 45%, #300609 100%);
			min-height: 100vh;
			margin: 0;
			padding: 32px;
			display: flex;
			justify-content: center;
			align-items: center;
		}

		.wrapper {
			width: min(760px, 100%);
			background: rgba(18, 8, 10, 0.86);
			border: 1px solid rgba(255, 80, 80, 0.28);
			border-radius: 28px;
			padding: 44px;
			box-shadow:
				0 0 40px rgba(255, 0, 55, 0.18),
				0 20px 80px rgba(0, 0, 0, 0.55);
			backdrop-filter: blur(16px);
			position: relative;
			overflow: hidden;
		}

		.wrapper::before {
			content: "";
			position: absolute;
			inset: -2px;
			background: linear-gradient(120deg, transparent, rgba(255, 50, 70, 0.2), transparent);
			pointer-events: none;
		}

		header, main {
			position: relative;
			z-index: 1;
		}

		header {
			text-align: center;
			margin-bottom: 32px;
		}

		.badge {
			display: inline-block;
			padding: 8px 14px;
			border-radius: 999px;
			background: rgba(255, 20, 50, 0.13);
			border: 1px solid rgba(255, 90, 90, 0.35);
			color: #ff9ca6;
			font-size: 0.82rem;
			font-weight: 700;
			letter-spacing: 0.12em;
			text-transform: uppercase;
			margin-bottom: 16px;
		}

		h1 {
			margin: 0;
			text-align: center;
			font-size: clamp(2rem, 5vw, 3.6rem);
			line-height: 1;
			font-weight: 800;
			letter-spacing: -0.06em;
			color: #ffffff;
			text-shadow: 0 0 24px rgba(255, 35, 60, 0.55);
		}

		.subtitle {
			max-width: 560px;
			margin: 18px auto 0;
			color: #d8b8ba;
			font-size: 1rem;
			text-align: center;
		}

		.content ul {
			list-style: none;
			padding: 0;
			margin: 0;
			display: grid;
			gap: 14px;
		}

		.content li {
			margin: 0;
		}

		a {
			display: flex;
			justify-content: space-between;
			align-items: center;
			text-decoration: none;
			color: #fff5f5;
			background: linear-gradient(135deg, rgba(80, 8, 12, 0.92), rgba(28, 8, 10, 0.92));
			border: 1px solid rgba(255, 85, 85, 0.24);
			border-radius: 18px;
			padding: 18px 20px;
			font-weight: 700;
			transition: transform 0.2s ease, border-color 0.2s ease, box-shadow 0.2s ease, background 0.2s ease;
		}

		a::after {
			content: "→";
			color: #ff5a67;
			font-size: 1.2rem;
			transition: transform 0.2s ease;
		}

		a:hover {
			transform: translateY(-3px);
			border-color: rgba(255, 90, 90, 0.65);
			box-shadow: 0 12px 30px rgba(255, 0, 45, 0.2);
			background: linear-gradient(135deg, rgba(130, 10, 18, 0.96), rgba(44, 8, 12, 0.96));
		}

		a:hover::after {
			transform: translateX(4px);
		}

		.content li:last-child a {
			background: linear-gradient(135deg, #9d0b16, #3a070d);
			border-color: rgba(255, 130, 130, 0.55);
			box-shadow: 0 0 28px rgba(255, 0, 60, 0.22);
		}

		.footer-note {
			position: relative;
			z-index: 1;
			text-align: center;
			margin-top: 28px;
			color: #a98b8f;
			font-size: 0.88rem;
		}

		@media (max-width: 600px) {
			body {
				padding: 18px;
				align-items: flex-start;
			}

			.wrapper {
				padding: 28px 20px;
				border-radius: 22px;
			}

			a {
				padding: 16px;
			}
		}
	</style>
</head>

<body>
	<div class="wrapper">
		<header>
			<div class="badge">CS184 / 284A</div>
			<h1>Homework Webpages</h1>
			<p class="subtitle">
				A collection of graphics assignments and our final Project Hail Minecraft shader showcase.
			</p>
		</header>

		<main>
			<div class="content">
				<ul>
					<li><a href="/hw1/index.html">Homework 1</a></li>
					<li><a href="/hw2/index.html">Homework 2</a></li>
					<li><a href="/hw3/index.html">Homework 3</a></li>
					<li><a href="/hw4/index.html">Homework 4</a></li>
					<li><a href="/Final Project/index.html">Final Project</a></li>
				</ul>
			</div>
		</main>

		<p class="footer-note">
			Designed with a red cinematic shader-inspired theme.
		</p>
	</div>

	<script>
		var links = document.body.getElementsByTagName("a");
		var a = window.location.href.indexOf(".io");

		if (a !== -1) {
			var repo_name = window.location.href.substring(a + 3);

			for (var i = 0; i < links.length; i++) {
				var link = links[i];

				if (link.href.includes(".io")) {
					var actual_name = link.href.substring(link.href.indexOf(".io") + 4);
					link.href = repo_name + actual_name;
				}
			}
		}
	</script>
</body>
</html>
